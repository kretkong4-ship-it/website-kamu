<!DOCTYPE html>
<html>
<head>
    <title>Buat Kamu 🩷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1 id="judul">Kamu suka aku ga? 🥺</h1>
        <img id="gif" src="gif1.gif" alt="kucing">
        <div id="tombol">
            <button class="yes" onclick="jawab('yes')">Mau dong ❤️</button>
            <button class="no" onclick="jawab('no')">Engga 😣</button>
        </div>
        <p id="teks"></p>
    </div>
<script>
    function jawab(pilihan) {
        let gif = document.getElementById('gif');
        let judul = document.getElementById('judul');
        let teks = document.getElementById('teks');
        let tombol = document.getElementById('tombol');

        if(pilihan === 'yes') {
            gif.src = "gif3.gif"; 
            judul.innerHTML = "YEYYY MAKASIII 😻❤️";
            teks.innerHTML = "Aku paling bahagia hari ini!";
            tombol.style.display = "none";
        } 
        else {
            gif.src = "gif2.gif"; 
            judul.innerHTML = "Huhuuu 😭";
            teks.innerHTML = "Gapapa... aku nangis di pojokan aja";
            tombol.style.display = "none";
        }
    }
</script>
</body>
</html>
