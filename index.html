<script>
let ukuranNo = 1;

function jawab(pilihan) {
    const gif = document.getElementById("gif");
    const judul = document.getElementById("judul");
    const teks = document.getElementById("teks");
    const btnNo = document.getElementById("btnNo");

    if (pilihan === "yes") {
        gif.src = "gif3.gif";
        judul.innerHTML = "YEYYY MAKASIII 🥰❤️";
        teks.innerHTML = "Aku paling bahagia hari ini!";
        document.getElementById("tombol").style.display = "none";
    } else {
        gif.src = "gif2.gif";
        judul.innerHTML = "Huhuuu 😭";
        teks.innerHTML = "Yakin mau nolak aku?";

        ukuranNo -= 0.3;
        btnNo.style.transform = `scale(${ukuranNo})`;

        if (ukuranNo <= 0.1) {
            btnNo.style.display = "none";
            teks.innerHTML = "Nah kan tombol NO nya udah ilang 😏";
        }
    }
}
</script>
